name: sgs_heroes
description: "Sanguosha Heroes Atlas"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.7

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # 数据仓库增量更新（六端共用，见 lib/core/sync/）
  http: ^1.2.0
  crypto: ^3.0.3
  # 生产 UpdateSink：native 落应用支持目录，Web 落 IndexedDB
  path_provider: ^2.1.5
  web: ^1.1.1
  # 本地账号（注册 / 登录 / 收藏隔离 / 导入导出）
  shared_preferences: ^2.3.0
  # 语音播放：皮肤与语音资源未托管，配置资源根 URL 后即可真播放
  audioplayers: ^6.1.0
  # 1:1 原页面：移动/苹果端用内嵌 WebView 加载随包原页面
  webview_flutter: ^4.14.1
  # Windows / Linux 没有 webview_flutter 实现，用桌面原生窗口补齐（WebView2 / WebKitGTK）
  desktop_webview_window: ^0.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # 随包 seed 数据（由 tools/seed_assets.py 从 ../data-repo 生成，约 25 MB）。
  # 注意：Flutter 的 assets 目录声明不递归，下面的清单由脚本自动维护，勿手改。
  assets:
    # >>> seed-assets:begin >>>
    - assets/seed/
    - assets/seed/heroes/
    - assets/seed/history/
    - assets/seed/history/books/
    - assets/seed/history/contents/
    - assets/seed/images/gjf/av/
    - assets/seed/images/hlsgs/av/
    - assets/seed/images/msgs/av/
    - assets/seed/images/msgs/icons/packages/
    - assets/seed/images/sgs/av/
    - assets/seed/images/sgs/icons/category/
    - assets/seed/images/sgs/icons/kingdom/
    - assets/seed/images/sgs/icons/packages/
    - assets/seed/images/sgs/icons/rarity/
    - assets/seed/images/sgsol/av/
    - assets/seed/images/wxmini/av/
    - assets/seed/meta/
    # <<< seed-assets:end <<<

    # >>> shell-assets:begin >>>
    - assets/shell/
    - assets/shell/assets/cards/basic/
    - assets/shell/assets/cards/equip/
    - assets/shell/assets/cards/scroll/
    - assets/shell/assets/cards/special/
    - assets/shell/audio/
    - assets/shell/data/
    - assets/shell/data/fks/
    - assets/shell/data/gjf/
    - assets/shell/data/history/
    - assets/shell/data/history/books/
    - assets/shell/data/history/contents/
    - assets/shell/data/hlsgs/
    - assets/shell/data/msgs/
    - assets/shell/data/ol_news/
    - assets/shell/data/ol_news/covers/
    - assets/shell/data/sgs/
    - assets/shell/data/sgsol/
    - assets/shell/data/wxmini/
    - assets/shell/data/x10_news/
    - assets/shell/data/x10_news/covers/
    - assets/shell/data/x10_news/heroes/
    - assets/shell/fonts/
    - assets/shell/images/brand/
    - assets/shell/images/fks/av/
    - assets/shell/images/fks/il/
    - assets/shell/images/gjf/av/
    - assets/shell/images/gjf/il/
    - assets/shell/images/hlsgs/av/
    - assets/shell/images/hlsgs/il/
    - assets/shell/images/msgs/av/
    - assets/shell/images/msgs/icons/packages/
    - assets/shell/images/msgs/il/
    - assets/shell/images/sgs/av/
    - assets/shell/images/sgs/icons/category/
    - assets/shell/images/sgs/icons/kingdom/
    - assets/shell/images/sgs/icons/packages/
    - assets/shell/images/sgs/icons/rarity/
    - assets/shell/images/sgs/il/
    - assets/shell/images/sgsol/av/
    - assets/shell/images/sgsol/il/
    - assets/shell/images/wxmini/av/
    - assets/shell/images/wxmini/il/
    - assets/shell/scripts/
    - assets/shell/services/
    - assets/shell/types/
    # <<< shell-assets:end <<<
